<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>谁是卧底</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* 全局动效关键帧：组件用 animate-[uc-xxx_时长_缓动] 引用。
         Linear 缓动 ease-out-expo = cubic-bezier(0.16,1,0.3,1)。 */
      @keyframes uc-fade-in { from { opacity: 0 } to { opacity: 1 } }
      @keyframes uc-fade-up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      @keyframes uc-pop-in { from { opacity: 0; transform: scale(0.92) } to { opacity: 1; transform: none } }
      @keyframes uc-pop { 0% { transform: scale(0) } 60% { transform: scale(1.25) } 100% { transform: scale(1) } }
      @keyframes uc-overlay-in { from { opacity: 0 } to { opacity: 1 } }
      @keyframes uc-breathe { 0%, 100% { opacity: 1 } 50% { opacity: 0.4 } }
      @keyframes uc-float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
      @keyframes uc-shake { 0%, 100% { transform: translateX(0) } 20%, 60% { transform: translateX(-4px) } 40%, 80% { transform: translateX(4px) } }
      @keyframes uc-rise { from { opacity: 0; transform: translateY(16px) scale(0.96) } to { opacity: 1; transform: none } }
      @keyframes uc-toast-in { from { opacity: 0; transform: translateX(110%) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body class="bg-canvas font-text text-body text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
